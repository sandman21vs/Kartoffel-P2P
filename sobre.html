<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre Mim - Sandmann</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Cabeçalho Compartilhado -->
  <header>
    <div class="logo">
      <img id="mainLogo" src="aa/logo.png" alt="Logo">
      <span id="siteName">Minha Página</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Comprar Bitcoin</a></li>
        <li><a href="taxas.html">Taxas</a></li>
        <li><a href="sobre.html" class="active">Sobre Mim</a></li>
      </ul>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <div class="container">
    <h1>Sobre Mim</h1>
    <div class="content" id="aboutContent">
      <!-- O conteúdo será inserido via JavaScript -->
    </div>
  </div>

  <!-- Inclusão dos scripts externos -->
  <script src="aa/taxas_config.js"></script>
  <script src="js/sobre.js"></script>
  
  
  <!-- Script de inicialização (para logo e nome do site) -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const logoEl = document.getElementById("mainLogo");
      if (logoEl) {
        logoEl.src = "aa/logo.png";
      }
      const siteNameEl = document.getElementById("siteName");
      if (siteNameEl && CONFIG && CONFIG.contact && CONFIG.contact.name) {
        siteNameEl.textContent = CONFIG.contact.name;
      }
    });
  </script>
</body>
</html>
